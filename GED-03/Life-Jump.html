html,
body{

    height:100%;
    overflow:hidden;
    font-family:

        Helvetica,
        sans-serif;
    background:#72d8ff;
}

#game{
    position:fixed;
    inset:0;

    width:100vw;
    height:100vh;

    display:block;
}


/* =====================================================
   HUD
===================================================== */

#hud{
    position:fixed;

    top:16px;
    left:16px;
    right:16px;

    z-index:20;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    pointer-events:none;
}

.hudLeft{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.panel{
    padding:11px 16px;

    min-width:130px;

    border-radius:17px;

    color:white;

    background:
        linear-gradient(
            145deg,
            rgba(31,61,71,.94),
            rgba(21,44,52,.86)
        );

    border:1px solid
        rgba(255,255,255,.18);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.18),

        inset 0 1px 0
        rgba(255,255,255,.12);

    backdrop-filter:blur(12px);
}

.label{
    color:#c9e6e9;

    font-size:10px;

    font-weight:900;

    letter-spacing:1.4px;

    text-transform:uppercase;
}

.value{
    margin-top:3px;

    font-size:22px;

    font-weight:950;
}

#energyPanel{
    width:230px;
}

.energyBar{
    height:12px;

    margin-top:7px;

    overflow:hidden;

    border-radius:100px;

    background:#10252c;

    border:1px solid
        rgba(255,255,255,.1);
}

#energyFill{
    width:100%;
    height:100%;

    border-radius:100px;

    background:
        linear-gradient(
            90deg,
            #48e087,
            #b8f15c
        );

    transition:
        width .2s,
        background .2s;
}

#controls{
    position:fixed;

    left:50%;
    bottom:15px;

    z-index:20;

    transform:
        translateX(-50%);

    padding:9px 17px;

    border-radius:100px;

    color:white;

    background:
        rgba(21,46,53,.72);

    border:1px solid
        rgba(255,255,255,.15);

    backdrop-filter:blur(10px);

    font-size:13px;

    font-weight:800;

    pointer-events:none;
}


/* =====================================================
   MENSAJE
===================================================== */

#message{
    position:fixed;

    z-index:60;

    left:50%;
    top:48%;

    width:min(
        440px,
        calc(100vw - 30px)
    );

    padding:20px 25px;

    transform:
        translate(-50%,-50%)
        scale(.85);

    opacity:0;

    text-align:center;

    color:white;

    border-radius:23px;

    background:
        rgba(18,40,47,.97);

    border:2px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.35);

    pointer-events:none;
}

#message.show{
    animation:
        messageAnimation
        2.1s ease forwards;
}

@keyframes messageAnimation{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.8);
    }

    12%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }

    78%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.94);
    }
}

.messageIcon{
    font-size:44px;
}

.messageTitle{
    margin-top:5px;

    font-size:24px;

    font-weight:950;
}

.messageText{
    margin-top:5px;

    color:#c7d9dc;

    line-height:1.4;

    font-size:14px;
}


/* =====================================================
   PANTALLA FINAL
===================================================== */

#endScreen{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    justify-content:center;
    align-items:center;

    background:
        rgba(7,25,31,.68);

    backdrop-filter:blur(8px);
}

#endScreen.show{
    display:flex;
}

.endCard{
    width:min(
        500px,
        calc(100vw - 30px)
    );

    padding:35px;

    text-align:center;

    color:white;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            #25464e,
            #122b33
        );

    border:1px solid
        rgba(255,255,255,.16);

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.5);
}

.endIcon{
    font-size:70px;
}

.endCard h1{
    margin-top:8px;

    font-size:34px;
}

.endCard p{
    margin-top:10px;

    color:#c4d9dc;

    line-height:1.5;
}

.restart{
    margin-top:25px;

    padding:14px 30px;

    border:0;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #8cf05c,
            #48d88b
        );

    color:#15342a;

    font-size:16px;

    font-weight:950;

    cursor:pointer;

    box-shadow:
        0 8px 25px
        rgba(55,210,110,.25);

    transition:
        transform .15s,
        filter .15s;
}

.restart:hover{
    transform:translateY(-3px);

    filter:brightness(1.07);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:650px){

    #hud{
        top:8px;
        left:8px;
        right:8px;
    }

    .panel{

    }

    .value{
        font-size:17px;
    }

    #energyPanel{
        width:165px;
    }

    #controls{
        bottom:8px;

        font-size:10px;
    }
}

/* =========================================================
   PARTÍCULAS
========================================================= */

let particles = [];


function createParticles(
    x,
    y,
    color
){

    for(
        let i=0;
        i<16;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)
                *180,

            vy:
                -Math.random()
                *220,

            life:1,

            size:
                3+
                Math.random()*5,

            color:color

        });

    }
}


function updateParticles(dt){

    particles.forEach(
        p => {

            p.x +=
                p.vx*dt;

            p.y +=
                p.vy*dt;

            p.vy +=
                420*dt;

            p.life -=
                dt*1.7;

        }
    );


    particles =
        particles.filter(
            p =>
                p.life > 0
        );
}


function drawParticles(){

    particles.forEach(
        p => {

            ctx.globalAlpha =
                Math.max(
                    0,
                    p.life
                );

            ctx.fillStyle =
                p.color;

            ctx.beginPath();

            ctx.arc(
                p.x-cameraX,
                p.y,
                p.size,
                0,
                Math.PI*2
            );

            ctx.fill();

        }
    );

    ctx.globalAlpha=1;
}


/* =========================================================
   CIELO
========================================================= */

function drawSky(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#63cfff"
    );

    gradient.addColorStop(
        .45,
        "#9ce8ff"
    );

    gradient.addColorStop(
        1,
        "#e7f9c4"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================================================
   SOL
========================================================= */

function drawSun(){

    const x =
        W*.78;

    const y =
        H*.18;


    const glow =
        ctx.createRadialGradient(
            x,
            y,
            10,
            x,
            y,
            130
        );

    glow.addColorStop(
        0,
        "rgba(255,250,170,.8)"
    );

    glow.addColorStop(
        .45,
        "rgba(255,230,100,.25)"
    );

    glow.addColorStop(
        1,
        "rgba(255,220,100,0)"
    );


    ctx.fillStyle =
        glow;

    ctx.fillRect(
        x-130,
        y-130,
        260,
        260
    );


    ctx.fillStyle =
        "#fff1a8";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        40,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================================================
   NUBES
========================================================= */

function cloud(
    x,
    y,
    s
){

    ctx.save();

    ctx.fillStyle =
        "rgba(255,255,255,.72)";


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        27*s,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+32*s,
        y-13*s,
        34*s,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+68*s,
        y,
        25*s,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillRect(
        x-5*s,
        y,
        78*s,
        24*s
    );

    ctx.restore();
}


function drawClouds(){

    cloud(
        100-cameraX*.08,
        120,
        1
    );

    cloud(
        430-cameraX*.05,
        190,

    );

    cloud(
        850-cameraX*.08,
        95,
        .8
    );

    cloud(
        1350-cameraX*.05,
        155,
        .7
    );

        1850-cameraX*.04,
        100,
        1
    );
}


/* =========================================================
   MONTAÑAS
========================================================= */

function drawMountains(){

    /*
        Montañas lejanas.
    */

    ctx.fillStyle =
        "#80b9ad";


    ctx.beginPath();

    ctx.moveTo(
        0,
        H*.65
    );


    const points = [

        [0,.57],
        [.08,.43],
        [.18,.55],
        [.27,.37],
        [.38,.56],
        [.50,.40],
        [.61,.55],
        [.72,.35],
        [.84,.55],
        [.93,.40],
        [1,.52]

    ];


    points.forEach(
        p => {

            ctx.lineTo(
                W*p[0],
                H*p[1]
            );

        }
    );


    ctx.lineTo(
        W,
        H
    );

    ctx.lineTo(
        0,
        H
    );

    ctx.closePath();

    ctx.fill();


    /*
        Montaña cercana.
    */

    ctx.fillStyle =
        "#4c9674";

    ctx.beginPath();

    ctx.moveTo(
        0,
        H*.76
    );


    const closePoints = [

        [0,.64],
        [.12,.51],
        [.23,.68],
        [.34,.48],
        [.46,.67],
        [.58,.51],
        [.71,.69],
        [.84,.48],
        [.94,.66],
        [1,.53]

    ];


    closePoints.forEach(
        p => {

            ctx.lineTo(
                W*p[0],
                H*p[1]
            );

        }
    );


    ctx.lineTo(
        W,
        H
    );

    ctx.lineTo(
        0,
        H
    );

    ctx.closePath();

    ctx.fill();
}


/* =========================================================

function drawPlatform(
    p
){

    const x =
        p.x -
        cameraX;

    const y =
        p.y;


    if(
        x+p.w < -50 ||
        x > W+50
    )
        return;


    /*
        Sombra.
    */

    ctx.fillStyle =
        "rgba(20,70,60,.18)";

    ctx.fillRect(
        x+8,
        y+10,
        p.w,
        p.h
    );


    /*
        Parte inferior.
    */

    const body =
        ctx.createLinearGradient(
            0,
            y,
            0,
            y+p.h
        );

    body.addColorStop(
        0,
        "#50ba73"
    );

    body.addColorStop(
        1,
        "#218151"
    );

    ctx.fillStyle =
        body;


    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        p.w,
        p.h,
        9
    );

    ctx.fill();


    /*
        Superficie.
    */

    ctx.fillStyle =
        "#a6e86a";

    ctx.beginPath();

    ctx.roundRect(
        x,
        y-6,
        p.w,
        12,
        6
    );

    ctx.fill();


    /*
        Detalles.
    */

    ctx.fillStyle =
        "rgba(255,255,255,.22)";

    for(
        let i=20;
        i<p.w;
        i+=45
    ){

        ctx.beginPath();

        ctx.arc(
            x+i,
            y+17,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}


/* =========================================================

function drawFood(

    if(food.collected)
        return;


    const p =
        platforms[
            food.platform

    const x =
        food.x -
        cameraX;


    const y =
        p.y-47;


    if(
        x < -80 ||
        x > W+80
    )

    /*
        Aura.
    */

    const color =
        food.type ===
        "healthy"
        ? "rgba(93,235,130,.24)"
        : "rgba(255,115,80,.22)";


    const glow =
        ctx.createRadialGradient(
            x,
            y,
            3,
            x,
            y,
            34
        );

    glow.addColorStop(
        0,
        color
    );

    glow.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        34,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        Círculo.
    */

    ctx.fillStyle =
        food.type ===
        "healthy"
        ? "#dfffe6"
        : "#fff0df";


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        25,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle =
        food.type ===
        "healthy"
        ? "#5bd47c"
        : "#ff8c56";

    ctx.lineWidth=3;

    ctx.stroke();


    /*
        Emoji.
    */

    ctx.font =
        "30px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        food.emoji,
        x,
        y
    );


    /*
        Flecha / indicador.
    */

    ctx.font =
        "bold 11px Arial";

    ctx.fillStyle =
        food.type ===
        "healthy"
        ? "#159447"
        : "#d95327";


    ctx.fillText(
        food.type ===
        "healthy"
        ? "+ ENERGÍA"
        : "- ENERGÍA",
        x,
        y-39
    );
}


/* =========================================================
   JUGADOR
========================================================= */

function drawPlayer(){

    const x =
        player.x -
        cameraX;

    const y =
        player.y;


    ctx.save();

    ctx.translate(
        x,
        y
    );


    /*
        Sombra.
    */

    ctx.fillStyle =
        "rgba(0,0,0,.18)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        player.height/2+5,
        26,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        Piernas.
    */

    ctx.strokeStyle =
        "#274c78";

    ctx.lineWidth=8;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        -7,
        14
    );

    ctx.lineTo(
        -13,
        34
    );

    ctx.lineTo(
        -20,
        39
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        7,
        14
    );

    ctx.lineTo(
        13,
        34
    );

    ctx.lineTo(
        22,
        38
    );

    ctx.stroke();


    /*
        Zapatos.
    */

    ctx.fillStyle =
        "#f3a33d";

    ctx.beginPath();

    ctx.ellipse(
        -22,
        40,
        12,
        6,
        -.1,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.ellipse(
        22,
        40,
        12,
        6,
        .1,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        Cuerpo.
    */

    const shirt =
        ctx.createLinearGradient(
            -20,
            -5,
            20,
            25
        );

    shirt.addColorStop(
        0,
        "#ff6c73"
    );

    shirt.addColorStop(
        1,
        "#e94060"
    );

    ctx.fillStyle =
        shirt;

    ctx.beginPath();

    ctx.roundRect(
        -20,
        -5,
        40,
        31,
        11
    );

    ctx.fill();


    /*
        Corazón.
    */

    ctx.fillStyle =
        "#fff";

    ctx.font =
        "14px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "♥",
        0,
        14
    );


    /*
        Brazos.
    */

    ctx.strokeStyle =
        "#f2b18d";

    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.moveTo(
        -17,
        1
    );

    ctx.lineTo(
        -27,
        18
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        17,
        1
    );

    ctx.lineTo(
        27,
        18
    );

    ctx.stroke();


    /*
        Cuello.
    */

    ctx.fillStyle =
        "#e8a57f";

    ctx.fillRect(
        -6,
        -12,
        12,
        9
    );


    /*
        Cabeza.
    */

    ctx.fillStyle =
        "#f1b18c";

    ctx.beginPath();

    ctx.arc(
        0,
        -27,
        19,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        Pelo.
    */

    ctx.fillStyle =
        "#6b3d2b";

    ctx.beginPath();

    ctx.arc(
        0,
        -34,
        20,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /*
        Ojos.
    */

    ctx.fillStyle =
        "#263238";

    ctx.beginPath();

    ctx.arc(
        -7,
        -27,
        2.5,
        0,
        Math.PI*2
    );

    ctx.arc(
        7,
        -27,
        2.5,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        Sonrisa.
    */

    ctx.strokeStyle =
        "#a84c52";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        0,
        -24,
        7,
        0,
        Math.PI
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   CÁMARA
========================================================= */

function updateCamera(){

    const target =
        player.x -
        W*.32;


    cameraX +=
        (
            target -
            cameraX
        ) * .08;


    cameraX =
        Math.max(
            0,
            Math.min(
                cameraX,
                worldWidth-W
            )
        );
}


/* =========================================================
   COLISIÓN CON PLATAFORMAS
========================================================= */

function checkPlatformCollision(
    oldY
){

    player.onGround=false;


    for(
        const p of platforms
    ){

        const playerBottom =
            player.y +
            player.height/2;


        const oldBottom =
            oldY +
            player.height/2;


        const horizontal =
            player.x +
            player.width/2 >
            p.x &&

            player.x -
            player.width/2 <
            p.x+p.w;


        const crossing =
            oldBottom <= p.y &&
            playerBottom >= p.y;


        if(
            horizontal &&
            crossing &&
            player.vy >= 0
        ){

            player.y =
                p.y -
                player.height/2;

            player.vy=0;

            player.onGround=true;

            player.coyote=.12;

            return;
        }
    }
}


/* =========================================================
   RECOGER COMIDA
========================================================= */

function checkFood(){

    for(
        const food of foods
    ){

        if(food.collected)
            continue;


        const p =
            platforms[
                food.platform
            ];


        const fx =
            food.x;

        const fy =
            p.y-47;


        const dx =
            player.x -
            fx;

        const dy =
            player.y -
            fy;


        const distance =
            Math.sqrt(
                dx*dx+
                dy*dy
            );


        if(
            distance < 55
        ){

            food.collected=true;


            if(
                food.type ===
                "healthy"
            ){

                /*
                    Comida saludable:
                    aumenta energía.
                */

                energy =
                    Math.min(
                        100,
                        energy+25
                    );


                /*
                    Mejora el salto.
                */

                player.jumpPower =
                    Math.min(
                        900,
                        player.jumpPower+35
                    );


                healthyCount++;


                createParticles(
                    fx,
                    fy,
                    "#65e887"
                );


                showMessage(
                    "🍎",
                    "¡Excelente elección!",
                    food.name +
                    " te da energía y hace tus saltos más fuertes. 💪",
                    true
                );

            }
            else{

                /*
                    Comida chatarra:
                    reduce energía.
                */

                energy =
                    Math.max(
                        5,
                        energy-20
                    );


                /*
                    Reduce salto.
                */

                player.jumpPower =
                    Math.max(
                        500,
                        player.jumpPower-45
                    );


                createParticles(
                    fx,
                    fy,
                    "#ff795e"
                );


                showMessage(
                    "🍔",
                    "¡Cuidado!",
                    food.name +
                    " reduce tu energía y hace tus saltos más pequeños.",
                    false
                );
            }


            updateHUD();
        }
    }
}


/* =========================================================
   INPUT
========================================================= */

window.addEventListener(
    "keydown",
    e => {

        const key =
            e.key.toLowerCase();


        if(
            key === "a" ||
            e.key === "ArrowLeft"
        ){

            keys.left=true;

            e.preventDefault();
        }


        if(
            key === "d" ||
            e.key === "ArrowRight"
        ){

            keys.right=true;

            e.preventDefault();
        }


        if(
            e.code === "Space" ||
            key === "w" ||
            e.key === "ArrowUp"
        ){

            if(
                !keys.jump &&
                gameRunning
            ){

                jump();

            }

            keys.jump=true;

            e.preventDefault();
        }

    }
);


window.addEventListener(
    "keyup",
    e => {

        const key =
            e.key.toLowerCase();


        if(
            key === "a" ||
            e.key === "ArrowLeft"
        ){

            keys.left=false;
        }


        if(
            key === "d" ||
            e.key === "ArrowRight"
        ){

            keys.right=false;
        }


        if(
            e.code === "Space" ||
            key === "w" ||
            e.key === "ArrowUp"
        ){

            keys.jump=false;
        }

    }
);


/* =========================================================
   SALTO
========================================================= */

function jump(){

    if(
        player.onGround ||
        player.coyote > 0
    ){

        player.vy =
            -player.jumpPower;

        player.onGround=false;

        createParticles(
            player.x,
            player.y+25,
            "#ffffff"
        );
    }
}


/* =========================================================
   ACTUALIZAR JUEGO
========================================================= */

function update(
    dt
){

    if(
        !gameRunning
    )
        return;


    /*
        Temporizador.
    */

    timer -= dt;


    if(
        timer <= 0
    ){

        timer=0;

        winGame();

        return;
    }


    /*
        Movimiento horizontal.
    */

    if(keys.left){

        player.vx =
            -player.speed;

    }
    else if(keys.right){

        player.vx =
            player.speed;

    }
    else{

        player.vx *=
            Math.pow(
                .0005,
                dt
            );
    }


    player.x +=
        player.vx *
        dt;


    /*
        Límites.
    */

    player.x =
        Math.max(
            20,
            Math.min(
                worldWidth-20,
                player.x
            )
        );


    /*
        Gravedad.
    */

    const oldY =
        player.y;


    player.vy +=
        1900 *
        dt;


    player.y +=
        player.vy *
        dt;


    /*
        Coyote time.
    */

    if(
        !player.onGround
    ){

        player.coyote -=
            dt;
    }


    checkPlatformCollision(
        oldY
    );


    checkFood();


    updateCamera();


    updateParticles(
        dt
    );


    /*
        Si cae demasiado,
        pierde.
    */

    if(
        player.y >
        H+180
    ){

        loseGame();

        return;
    }


    updateHUD();
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById(
        "timer"
    ).textContent =
        Math.ceil(timer);


    document.getElementById(
        "energyText"
    ).textContent =
        Math.floor(energy);


    document.getElementById(
        "healthyCount"
    ).textContent =
        healthyCount;


    const fill =
        document.getElementById(
            "energyFill"
        );


    fill.style.width =
        energy+"%";


    if(
        energy <= 25
    ){

        fill.style.background =
            "linear-gradient(90deg,#ff4d5e,#ff814f)";

    }
    else if(
        energy <= 50
    ){

        fill.style.background =
            "linear-gradient(90deg,#ffb12b,#ffe04c)";

    }
    else{

        fill.style.background =
            "linear-gradient(90deg,#48e087,#b8f15c)";
    }
}


/* =========================================================
   MENSAJE
========================================================= */

let messageTimer;


function showMessage(
    icon,
    title,
    text,
    good
){

    const box =
        document.getElementById(
            "message"
        );


    document.getElementById(
        "messageIcon"
    ).textContent =
        icon;


    document.getElementById(
        "messageTitle"
    ).textContent =
        title;


    document.getElementById(
        "messageText"
    ).textContent =
        text;


    box.style.borderColor =
        good
        ? "rgba(76,230,130,.55)"
        : "rgba(255,100,80,.55)";


    box.classList.remove(
        "show"
    );


    void box.offsetWidth;


    box.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            () => {

                box.classList.remove(
                    "show"
                );

            },
            2100
        );
}


/* =========================================================
   GANAR
========================================================= */

function winGame(){

    if(
        !gameRunning
    )
        return;


    gameRunning=false;


    document.getElementById(
        "endIcon"
    ).textContent =
        "🏆";


    document.getElementById(
        "endTitle"
    ).textContent =
        "¡Lo lograste!";


    document.getElementById(
        "endText"
    ).textContent =
        "¡Excelente! Te mantuviste sobre " +
        "las plataformas durante todo el tiempo. " +
        "Elegiste " +
        healthyCount +
        " alimentos saludables. 🍎💪";


    document.getElementById(
        "endScreen"
    ).classList.add(
        "show"
    );
}


/* =========================================================
   PERDER
========================================================= */

function loseGame(){

    if(
        !gameRunning
    )
        return;


    gameRunning=false;


    document.getElementById(
        "endIcon"
    ).textContent =
        "😵";


    document.getElementById(
        "endTitle"
    ).textContent =
        "¡Te caíste!";


    document.getElementById(
        "endText"
    ).textContent =
        "No pasa nada. Intenta calcular mejor tus saltos y busca alimentos que te den energía. 🍎";


    document.getElementById(
        "endScreen"
    ).classList.add(
        "show"
    );
}


/* =========================================================
   REINICIAR
========================================================= */

function restartGame(){

    gameRunning=true;

    timer=60;

    energy=70;

    healthyCount=0;

    cameraX=0;


    player.x=180;

    player.y=450;

    player.vx=0;

    player.vy=0;

    player.jumpPower=710;

    player.onGround=false;

    player.coyote=0;


    foods.forEach(
        food => {

            food.collected=false;

        }
    );


    particles=[];


    document.getElementById(
        "endScreen"
    ).classList.remove(
        "show"
    );


    updateHUD();
}


/* =========================================================
   DIBUJAR
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawSky();

    drawSun();

    drawClouds();

    drawMountains();


    /*
        Plataformas.
    */

    platforms.forEach(
        p => {

            drawPlatform(p);

        }
    );


    /*
        Comida.
    */

    foods.forEach(
        food => {

            drawFood(food);

        }
    );


    drawParticles();

    drawPlayer();
}


/* =========================================================
   LOOP
========================================================= */

function loop(
    now
){

    const dt =
        Math.min(
            (now-lastTime)/1000,
            .033
        );


    lastTime=now;


    update(dt);

    draw();


    requestAnimationFrame(
        loop
    );
}


/* =========================================================
   INICIAR
========================================================= */

updateHUD();

requestAnimationFrame(
    loop
);

</script>
